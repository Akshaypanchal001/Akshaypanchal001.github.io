<form action="https://formsubmit.co/info@corecircuits.in"
      method="POST"
      enctype="multipart/form-data">

  <!-- FormSubmit settings -->
  <input type="hidden" name="_subject"
         value="New PCB Enquiry – CoreCircuits Website">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">
  <!-- Optional redirect -->
  <!-- <input type="hidden" name="_next" value="thank-you.html"> -->

  <label>Your Name</label>
  <input type="text" name="name" required>

  <label>Your Email</label>
  <input type="email" name="email" required>

  <label>Your Message</label>
  <textarea name="message" rows="5"
    placeholder="Please mention quantity, layers, material, finish, timeline"></textarea>

  <label>Upload PCB Files</label>
  <input type="file" name="attachment" multiple
    accept=".zip,.rar,.pdf,.xls,.xlsx,.csv,.txt,.png,.jpg,.jpeg,.sch">

  <small>
    Allowed: Gerber (ZIP), BOM, Pick & Place, Schematic, Images (Max ~10MB)
  </small>

  <button type="submit">Send Message</button>
</form>
