<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | CoreCircuits</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="nav-container">
    <div class="logo">
      <img src="logo.png" alt="CoreCircuits">
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="pcb-design.html">PCB Design</a>
      <a href="pcb-manufacturing.html">Manufacturing</a>
      <a href="pcb-assembly.html">Assembly</a>
      <a href="contact.html" class="nav-btn">Contact</a>
    </nav>
  </div>
</header>

<!-- CONTACT SECTION -->
<section class="section">
  <h2>Contact Us</h2>
  <p class="center-text">
    Tell us about your project and we’ll get back to you shortly.
  </p>

  <div class="contact-container">
    <form class="contact-form" action="#" method="POST">

      <div class="form-group">
        <label>Your Name</label>
        <input type="text" name="name" required>
      </div>

      <div class="form-group">
        <label>Your Email</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Your Message</label>
        <textarea name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn primary">Send Message</button>

    </form>
  </div>
</section>

<footer>
  © 2026 CoreCircuits · All Rights Reserved
</footer>

<script src="script.js"></script>
</body>
</html>
