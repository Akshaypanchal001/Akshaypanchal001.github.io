<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | CoreCircuits</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo-text">
      <span class="logo-icon">▣</span>
      Core<span>Circuits</span>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#services">Services</a>
      <a href="contact.html" class="nav-btn">Contact</a>
    </nav>
  </div>
</header>

<section class="section contact-premium">
  <div class="contact-wrapper">

    <div class="contact-info">
      <h2>Let’s Build Something Exceptional</h2>
      <p>
        Share your project requirements and our engineering team will respond within 24 hours.
      </p>
      <div class="info-item">📧 info@corecircuits.in</div>
      <div class="info-item">📍 India</div>
      <div class="info-item">⏱ Engineering Support</div>
    </div>

    <div class="contact-card">
      <form>
        <div class="form-group">
          <label>Name</label>
          <input type="text" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" required>
        </div>

        <div class="form-group">
          <label>Project Details</label>
          <textarea rows="5" required></textarea>
        </div>

        <button class="btn primary"><span>Send Message</span></button>
      </form>
    </div>

  </div>
</section>

<footer>
  © 2026 CoreCircuits · Precision Electronics Engineering
</footer>

<script src="script.js"></script>
</body>
</html>
