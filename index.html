<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreCircuits - Site Under Maintenance</title>
    <style>
        /* Reset basic styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Clean, light background mimicking the warning page */
        body, html {
            height: 100%;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f6f9; /* Soft light blue/grey background */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The centered white card */
        .info-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); /* Soft floating shadow */
            text-align: center;
            margin: 20px;
        }

        /* Logo styling */
        .logo-container {
            margin-bottom: 24px;
        }
        
        .logo-container img {
            max-width: 160px; /* Sized perfectly for the card */
            height: auto;
        }

        /* Typography */
        .card-title {
            color: #202124;
            font-size: 24px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .card-description {
            color: #5f6368;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
            padding: 0 10px;
        }

        /* Button Container */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        /* Generic Button Styling */
        .btn {
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            border: none;
            cursor: pointer;
        }

        /* Primary Button (Navy Blue matching CoreCircuits logo) */
        .primary-btn {
            background-color: #1a4b8c; 
            color: #ffffff;
        }

        .primary-btn:hover {
            background-color: #123666; /* Darker blue on hover */
            box-shadow: 0 2px 6px rgba(26, 75, 140, 0.4);
        }

        /* Secondary Button (Grey) */
        .secondary-btn {
            background-color: #f1f3f4;
            color: #202124;
        }

        .secondary-btn:hover {
            background-color: #e8eaed;
        }
        
        /* Mobile responsiveness: stacks buttons on very small screens */
        @media (max-width: 400px) {
            .action-buttons {
                flex-direction: column;
                gap: 12px;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="info-card">
        <div class="logo-container">
            <img src="logo.png" alt="CoreCircuits Logo">
        </div>
        
        <h1 class="card-title">Site Under Maintenance</h1>
        
        <p class="card-description">
            We are currently updating our website to serve you better. For any urgent PCB manufacturing or assembly inquiries, please reach out to us directly.
        </p>
        
        <div class="action-buttons">
            <a href="contact.html" class="btn primary-btn">Contact Us</a>
            <a href="mailto:info@corecircuits.in" class="btn secondary-btn">Email Us</a>
        </div>
    </div>

</body>
</html>
